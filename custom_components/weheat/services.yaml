set_quiet_mode:
  name: Set quiet mode
  description: Set the daytime performance or quiet mode preset for a Weheat heat pump. Presets range from Performance (extra savings / maximum power) to Silent 4 (extra quiet / maximum daytime noise reduction) by capping compressor and fan speeds.
  target:
    device:
      integration: weheat
    entity:
      integration: weheat
  fields:
    mode:
      name: Mode
      description: The quiet mode preset to apply (Mode 5 - Max capacity / 0 down to Mode 1 - Minimum noise / 4).
      required: true
      example: "Mode 3 - Reduced"
      selector:
        select:
          options:
            - label: "Mode 5 - Max capacity (0: Extra savings / Maximum power)"
              value: "Mode 5 - Max capacity"
            - label: "Mode 4 - Standard (1: Silent 1 - Nominal balanced capacity)"
              value: "Mode 4 - Standard"
            - label: "Mode 3 - Reduced (2: Silent 2 - Reduced power & noise)"
              value: "Mode 3 - Reduced"
            - label: "Mode 2 - Low noise (3: Silent 3 - Strict residential noise limits)"
              value: "Mode 2 - Low noise"
            - label: "Mode 1 - Minimum noise (4: Silent 4 - Extra quiet / lowest power)"
              value: "Mode 1 - Minimum noise"

set_silent_schedule:
  name: Set silent schedule
  description: Configure the silent hours preset, active days of week, and daily start/stop quiet window. Presets cap night power and noise levels.
  target:
    device:
      integration: weheat
    entity:
      integration: weheat
  fields:
    preset:
      name: Preset
      description: Silent hours preset level to activate during the scheduled quiet window (Off disables schedule; Normal down to Minimum apply progressively quieter night limits).
      required: true
      example: "Background chatter"
      selector:
        select:
          options:
            - label: "Off (0: Disable scheduled quiet hours)"
              value: "Off"
            - label: "Minimum (7: Silent 7 - Level 7 night limit - Maximum quietness)"
              value: "Minimum"
            - label: "Whisper (6: Silent 6 - Level 6 night limit - Ultra quiet night limit)"
              value: "Whisper"
            - label: "Library (4: Silent 4 - Level 4 night limit - Very quiet night limit)"
              value: "Library"
            - label: "Light rain (3: Silent 3 - Level 3 night limit - High night noise cap)"
              value: "Light rain"
            - label: "Background chatter (2: Silent 2 - Level 2 night limit - Moderate night noise cap)"
              value: "Background chatter"
            - label: "Normal (1: Silent 1 - Level 1 night limit - Highest night power)"
              value: "Normal"
    days:
      name: Days of the week
      description: Days of the week to apply the schedule to (leave blank to apply to all 7 days).
      required: false
      example: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
      selector:
        select:
          multiple: true
          options:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
    start_time:
      name: Start time
      description: Time when the silent hours period begins (e.g. 22:00).
      required: true
      example: "22:00"
      selector:
        time: {}
    stop_time:
      name: Stop time
      description: Time when the silent hours period ends (e.g. 07:00).
      required: true
      example: "07:00"
      selector:
        time: {}

trigger_legionella_prevention:
  name: Trigger legionella prevention
  description: Manually trigger a one-shot Legionella thermal disinfection cycle on the Weheat heat pump.
  target:
    device:
      integration: weheat
    entity:
      integration: weheat

set_cooling:
  name: Set cooling mode and curve
  description: Enable or disable cooling mode and optionally configure the 2-point cooling curve water target temperatures at 22°C outside (mild day) and 40°C outside (peak-summer day).
  target:
    device:
      integration: weheat
    entity:
      integration: weheat
  fields:
    enabled:
      name: Cooling mode enabled
      description: Enable or disable cooling mode on the heat pump.
      required: true
      example: true
      selector:
        boolean: {}
    mild_temperature:
      name: Cooling water target at 22°C outside
      description: Target cooling water temperature (°C) on a mild day (22°C outside). Lower values provide stronger cooling.
      required: false
      example: 18
      selector:
        number:
          min: 15
          max: 22
          step: 1
          unit_of_measurement: "°C"
          mode: box
    peak_temperature:
      name: Cooling water target at 40°C outside
      description: Target cooling water temperature (°C) on a peak-summer day (40°C outside). Slightly higher water temperatures reduce condensation risk in humid weather.
      required: false
      example: 20
      selector:
        number:
          min: 15
          max: 22
          step: 1
          unit_of_measurement: "°C"
          mode: box

set_heating_curve:
  name: Set heating control method and curve
  description: Atomically configure the central heating control method (Heating curve, On/Off thermostat, or OpenTherm thermostat) and the 5-point weather-compensated heating curve water target temperatures at -20°C, 9°C, 15°C, 20°C, and 25°C outside.
  target:
    device:
      integration: weheat
    entity:
      integration: weheat
  fields:
    control_method:
      name: Control method
      description: Central heating control method (Heating curve, On/Off thermostat, or OpenTherm thermostat).
      required: false
      example: "Heating curve"
      selector:
        select:
          options:
            - label: "Heating curve (1: Weather-compensated heating curve)"
              value: "Heating curve"
            - label: "On/Off thermostat (2: On/Off thermostat + heating curve)"
              value: "On/Off thermostat"
            - label: "OpenTherm thermostat (4: Smart OpenTherm thermostat)"
              value: "OpenTherm thermostat"
    at_minus_20c:
      name: Heating water target at -20°C outside
      description: Target supply water temperature (°C) at -20°C outside. Keep <= 38–40°C to prevent the 2.85 kW backup electric heater from triggering.
      required: false
      example: 37
      selector:
        number:
          min: 15
          max: 65
          step: 1
          unit_of_measurement: "°C"
          mode: box
    at_9c:
      name: Heating water target at 9°C outside
      description: Target supply water temperature (°C) at 9°C outside.
      required: false
      example: 28
      selector:
        number:
          min: 15
          max: 65
          step: 1
          unit_of_measurement: "°C"
          mode: box
    at_15c:
      name: Heating water target at 15°C outside
      description: Target supply water temperature (°C) at 15°C outside.
      required: false
      example: 24
      selector:
        number:
          min: 15
          max: 65
          step: 1
          unit_of_measurement: "°C"
          mode: box
    at_20c:
      name: Heating water target at 20°C outside
      description: Target supply water temperature (°C) at 20°C outside.
      required: false
      example: 20
      selector:
        number:
          min: 15
          max: 65
          step: 1
          unit_of_measurement: "°C"
          mode: box
    at_25c:
      name: Heating water target at 25°C outside
      description: Target supply water temperature (°C) at 25°C outside.
      required: false
      example: 18
      selector:
        number:
          min: 15
          max: 65
          step: 1
          unit_of_measurement: "°C"
          mode: box

